name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build the reports and test them
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint and format
        run: ruff check . && ruff format --check .
      - name: Rebuild the data and the reports
        run: |
          python src/generate_data.py
          python -m src.analyze
      - name: Committed data and reports match the code
        # Charts are left out: PNG bytes can differ between machines even when the picture is the same.
        run: |
          if ! git diff --exit-code --stat -- data reports ':!reports/charts'; then
            echo "::error::data/ or reports/ is out of date. Run generate_data.py and src.analyze, then commit."
            exit 1
          fi
      - name: Tests, with at least 90% coverage
        run: python -m pytest -v --cov
